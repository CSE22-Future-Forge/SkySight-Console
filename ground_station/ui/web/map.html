<html lang="en">
<head>

  <title>SAR Manifest map</title>
  <link rel="stylesheet" href="lib/maplibre-gl.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <div id="map"></div>
  <div id="banner" hidden></div>

  <script src="lib/pmtiles.js"></script>
  <script src="map.js"></script>
</body>
</html>
